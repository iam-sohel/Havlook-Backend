name: HavLook Backend CI

on:
  workflow_call:

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Minimum permissions by default.
permissions:
  contents: read

# Cancel outdated runs for the same branch.
concurrency:
  group: havlook-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --------------------------------------------------
  # JOB 1: SECRET AND VULNERABILITY SCANNING
  # --------------------------------------------------
  security-scan:
    name: Security & Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-dirs: node_modules,.git,.mvn

  # --------------------------------------------------
  # JOB 2: JAVA BUILD AND TESTS
  # --------------------------------------------------
  backend-build:
    name: Backend Build & Test
    needs:
      - security-scan

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Verify Java and Maven
        run: |
          java -version
          ./mvnw --version

      - name: Build and verify backend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MSG91_AUTH_KEY: ${{ secrets.MSG91_AUTH_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_STORAGE_AUTH_KEY: ${{ secrets.SUPABASE_STORAGE_AUTH_KEY }}
          SANDBOX_API_KEY: ${{ secrets.SANDBOX_API_KEY }}
          SANDBOX_API_SECRET: ${{ secrets.SANDBOX_API_SECRET }}
          NUMVERIFY_ACCESS_KEY: ${{ secrets.NUMVERIFY_ACCESS_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            clean verify

      - name: Upload tested backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: havlook-backend-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 1
