# =====================================================================
# NextCart backend - SAFE TEMPLATE
# ---------------------------------------------------------------------
# Copy this file to application.properties (or export the values as
# environment variables) when setting up a local development copy of
# the project. NEVER commit a real application.properties back to
# source control. Real values belong in your local environment or a
# secret manager, NOT in this repo.
# =====================================================================

spring.application.name=nextcart-backend

# Local dev profile - see application-dev.properties for what it overrides.
spring.profiles.active=dev

# --- Database --------------------------------------------------------
# Local Postgres example:
#   spring.datasource.url=jdbc:postgresql://localhost:5432/nextcart
#   spring.datasource.username=nextcart
#   spring.datasource.password=changeme
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate -------------------------------------------------
# These are overridden in application-dev.properties. Override here only
# if you want to deviate from the dev profile.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# --- JWT signing key -------------------------------------------------
# Generate a fresh random key for any non-throwaway environment:
#   openssl rand -base64 48
# Must be at least 32 bytes (256 bits) for HS256.
app.security.jwt.secret=

# --- Razorpay payment gateway ----------------------------------------
# Test-mode keys are fine for local development. Live keys must NEVER
# appear in source control.
razorpay.key.id=
razorpay.key.secret=
razorpay.webhook.secret=
