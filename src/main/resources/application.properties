spring.application.name=havlook-backend

# =========================================================
# SERVER
# =========================================================

server.port=8080
server.address=0.0.0.0


# =========================================================
# SECURITY
# =========================================================

app.security.jwt.secret=${JWT_SECRET}


# =========================================================
# ORDER EXPIRY
# =========================================================

havlook.order.expiry.fixed-delay-ms=60000


# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.cbkyvodjqyiebtdexrrd
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=240000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=120000



# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# RAZORPAY PAYMENT GATEWAY
# =========================================================

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}


# =========================================================
# EMAIL / GMAIL SMTP
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# =========================================================
# MSG91
# =========================================================

msg91.auth-key=${MSG91_AUTH_KEY}

# =========================================================
# SUPABASE
# =========================================================

supabase.url=https://cbkyvodjqyiebtdexrrd.supabase.co
supabase.kyc-bucket=sellerekyc

supabase.service-role-key=${SUPABASE_SECRET_KEY}

supabase.storage-authorization-key=${SUPABASE_STORAGE_AUTH_KEY}

# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=12MB


# =========================================================
# SELLER VERIFICATION
# =========================================================

# ---------------------------------------------------------
# SANDBOX - PAN KYC
# ---------------------------------------------------------

seller.verification.sandbox.base-url=https://test-api.sandbox.co.in
seller.verification.sandbox.api-key=${SANDBOX_API_KEY}
seller.verification.sandbox.api-secret=${SANDBOX_API_SECRET}


# ---------------------------------------------------------
# APILAYER NUMVERIFY - MOBILE VERIFICATION
# ---------------------------------------------------------

seller.verification.numverify.base-url=https://apilayer.net/api
seller.verification.numverify.access-key=${NUMVERIFY_ACCESS_KEY}


# ---------------------------------------------------------
# HUNTER.IO - EMAIL VERIFICATION
# ---------------------------------------------------------

seller.verification.hunter.base-url=https://api.hunter.io/v2
seller.verification.hunter.api-key=${HUNTER_API_KEY}


# ---------------------------------------------------------
# GST VERIFICATION
# ---------------------------------------------------------

seller.verification.gst.base-url=https://razorpay.com/api