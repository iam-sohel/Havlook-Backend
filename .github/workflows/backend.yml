name: HavLook Backend CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Minimum permissions by default.
# AWS OIDC permission is granted only to the publishing job.
permissions:
  contents: read

# Cancel outdated runs for the same branch.
# Do not cancel an in-progress deployment image push unnecessarily.
concurrency:
  group: havlook-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "289981265262"
  ECR_REPOSITORY: havlook/backend
  AWS_ROLE_ARN: arn:aws:iam::289981265262:role/GitHubActions-NextCart-ECR

jobs:
  # --------------------------------------------------
  # JOB 1: SECRET AND VULNERABILITY SCANNING
  # --------------------------------------------------
  security-scan:
    name: Security & Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-dirs: node_modules,.git,.mvn

  # --------------------------------------------------
  # JOB 2: JAVA BUILD AND TESTS
  # --------------------------------------------------
  backend-build:
    name: Backend Build & Test
    needs:
      - security-scan

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Verify Java and Maven
        run: |
          java -version
          ./mvnw --version

      - name: Build and verify backend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MSG91_AUTH_KEY: ${{ secrets.MSG91_AUTH_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_STORAGE_AUTH_KEY: ${{ secrets.SUPABASE_STORAGE_AUTH_KEY }}
          SANDBOX_API_KEY: ${{ secrets.SANDBOX_API_KEY }}
          SANDBOX_API_SECRET: ${{ secrets.SANDBOX_API_SECRET }}
          NUMVERIFY_ACCESS_KEY: ${{ secrets.NUMVERIFY_ACCESS_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
        run: |
          ./mvnw \
            --batch-mode \
            --no-transfer-progress \
            clean verify

  # --------------------------------------------------
  # JOB 3: BUILD AND PUBLISH DOCKER IMAGE TO ECR
  # --------------------------------------------------
  publish-image:
    name: Build & Publish Docker Image to ECR

    needs:
      - security-scan
      - backend-build

    # Never publish an image from a pull request or another branch.
    # Manual runs are allowed only when the selected branch is main.
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate AWS configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ACCOUNT_ID must contain exactly 12 digits."
            exit 1
          fi

          if [[ "$AWS_ROLE_ARN" != "arn:aws:iam::${AWS_ACCOUNT_ID}:role/"* ]]; then
            echo "::error::AWS_ROLE_ARN does not match AWS_ACCOUNT_ID."
            exit 1
          fi

          if [[ ! -f Dockerfile ]]; then
            echo "::error::Dockerfile not found at the repository root."
            exit 1
          fi

          echo "AWS region: $AWS_REGION"
          echo "ECR repository: $ECR_REPOSITORY"

      - name: Configure AWS credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: HavLook-Backend-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          ACTUAL_ACCOUNT="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          if [[ "$ACTUAL_ACCOUNT" != "$AWS_ACCOUNT_ID" ]]; then
            echo "::error::Authenticated to an unexpected AWS account."
            exit 1
          fi

      - name: Verify ECR repository
        shell: bash
        run: |
          set -euo pipefail

          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/havlook/backend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/havlook/backend:latest
          cache-from: type=gha,scope=havlook-backend
          cache-to: type=gha,mode=max,scope=havlook-backend

      - name: Verify published ECR image tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking commit-SHA image..."

          SHA_DIGEST="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          echo "Checking latest image..."

          LATEST_DIGEST="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag=latest \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          if [[ -z "$SHA_DIGEST" || "$SHA_DIGEST" == "None" ]]; then
            echo "::error::Commit-SHA image was not found in ECR."
            exit 1
          fi

          if [[ -z "$LATEST_DIGEST" || "$LATEST_DIGEST" == "None" ]]; then
            echo "::error::The latest image tag was not found in ECR."
            exit 1
          fi

          if [[ "$SHA_DIGEST" != "$LATEST_DIGEST" ]]; then
            echo "::error::The commit-SHA and latest tags point to different image digests."
            exit 1
          fi

          echo "Verified commit: $IMAGE_TAG"
          echo "Verified image digest: $SHA_DIGEST"
          echo "Both ECR tags point to the same image."
